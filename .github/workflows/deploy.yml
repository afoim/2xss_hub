name: Deploy to main

on:
  push:
    branches:
      - edit

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: source

      - name: Build project
        run: yarn build
        working-directory: source

      - uses: actions/checkout@v4
        with:
          ref: main
          path: deploy

      - name: Copy build artifacts to deploy
        run: |
          rm -rf deploy/*
          cp -r source/build/* deploy/

      - name: Commit and push to main
        run: |
          cd deploy
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git diff --staged --quiet || git commit -m "Deploy from edit branch"
          git push
