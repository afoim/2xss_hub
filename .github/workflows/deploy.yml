name: Deploy

on:
  push:
    branches:
      - edit

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: 推送产物到 main（dist/ 子目录 + wrangler.jsonc）
        env:
          TOKEN: ${{ github.token }}
        run: |
          WORKDIR="$(mktemp -d)"
          cp -r dist "$WORKDIR/dist"
          cp wrangler.jsonc "$WORKDIR/"

          cd "$WORKDIR"
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q \
            -m "build: ${GITHUB_SHA:0:7} 的构建产物" \
            -m "workflow: ${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}"
          git push --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:main
          rm -rf "$WORKDIR"
